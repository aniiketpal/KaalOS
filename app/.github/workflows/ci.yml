name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Typecheck
        working-directory: app
        run: npx tsc -b --force
      - name: Test
        working-directory: app
        run: npm test
      - name: Build
        working-directory: app
        run: npm run build
